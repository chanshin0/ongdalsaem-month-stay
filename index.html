<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>깊은산속 옹달샘 한달살기</title>
<link rel="icon" href="data:,">
<style>
  /* 화면에는 원본 이미지 한 장만 보인다. 여백·테두리·머리말·꼬리말 없음. */
  html, body { margin: 0; padding: 0; background: #fff; }

  /* 1920px 까지는 화면 폭에 맞추고, 그보다 넓으면 1920px 로 가운데 정렬(양옆 흰색). */
  .page { position: relative; max-width: 1920px; margin: 0 auto; }
  .page img { display: block; width: 100%; height: auto; }

  /* 보이지 않는 누름 영역 2개.
     위치·크기는 원본 이미지(1920 x 8696) 대비 비율(%)이라 어느 폭에서도 그려진 버튼과 맞는다.
     top 은 영역의 위쪽 끝이다(버튼 위쪽 끝보다 6px 위).
     min-height 는 좁은 화면에서 손가락으로 누를 수 있게 하는 최소 높이(조정 가능).
     좁은 화면에서 영역은 아래쪽으로만 늘어난다 — 버튼 바로 위에 있는 글줄을 덮지 않기 위해서다. */
  .cta {
    position: absolute;
    display: block;
    min-height: 44px;
    cursor: pointer;
  }
  /* 실측 버튼: x 476..942, y 613..678 → 영역: x 470..949, y 607..685 (높이 78) */
  .cta-top    { left: 24.479167%; width: 24.947917%; top: 6.980221%;  height: 0.896964%; }
  /* 실측 버튼: x 700..1223, y 8428..8503 → 영역: x 694..1230, y 8422..8510 (높이 88) */
  .cta-bottom { left: 36.145833%; width: 27.916667%; top: 96.849126%; height: 1.011960%; }

  /* 키보드로 이동했을 때만 보이는 초점 표시 */
  .cta:focus-visible {
    outline: 3px solid #0b3d91;
    outline-offset: 2px;
    box-shadow: 0 0 0 2px #fff;
  }
</style>
</head>
<body>
<main class="page">
  <img src="2026month.jpg" width="1920" height="8696"
       alt="깊은산속 옹달샘 한달살기 — 천천히 자고, 걷고, 먹고, 책을 읽고 아무것도 하지 않는 시간도 가져봅니다.">

  <!-- 상담 신청 주소 (1/2): 주소를 바꿀 때는 아래 href 와 (2/2)의 href 를 똑같이 함께 바꾼다. 주소 안의 & 는 &amp; 로 적는다. -->
  <a class="cta cta-top"
     href="https://www.godowoncenter.com/bbs/?mode=write&amp;b_code=maintokeeper&amp;cate=657"
     target="_blank" rel="noopener"
     aria-label="깊은산속 옹달샘 한달살기 상담 신청하기"></a>

  <!-- 상담 신청 주소 (2/2): 위 (1/2)와 똑같은 주소여야 한다. -->
  <a class="cta cta-bottom"
     href="https://www.godowoncenter.com/bbs/?mode=write&amp;b_code=maintokeeper&amp;cate=657"
     target="_blank" rel="noopener"
     aria-label="깊은산속 옹달샘 한달살기 상담 신청하기"></a>
</main>
</body>
</html>
